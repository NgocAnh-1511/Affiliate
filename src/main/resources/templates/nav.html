<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- ==========================================================================
       Thanh Điều hướng Bên trái (Left Sidebar Shared Fragment)
       ========================================================================== -->
    <aside th:fragment="sidebar(activePage)" class="sidebar">
        <!-- Logo Thương hiệu -->
        <div class="sidebar-logo">
            <svg class="logo-icon" width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <linearGradient id="logoGradSide" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a78bfa" />
                        <stop offset="60%" stop-color="#6366f1" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="20" r="10" fill="url(#logoGradSide)" />
                <path d="M50 35C41 35 30 40 22 46C29 48 37 47 43 47V78C43 83 57 83 57 78V47C63 47 71 48 78 46C70 40 59 35 50 35Z" fill="url(#logoGradSide)" />
                <path d="M28 42L18 78C16 83 24 85 26 80L36 45C32 44 30 43 28 42Z" fill="url(#logoGradSide)" opacity="0.8" />
                <path d="M72 42L82 78C84 83 76 85 74 80L64 45C68 44 70 43 72 42Z" fill="url(#logoGradSide)" opacity="0.8" />
            </svg>
            <div class="logo-text-group">
                <span class="logo-text-top">KOC/KOL</span>
                <span class="logo-text-bottom">Affiliate Network</span>
            </div>
        </div>
        
        <!-- Danh sách các Menu chức năng -->
        <nav>
            <ul class="menu-list">
                <li>
                    <a href="dashboard.html" th:href="@{/dashboard}" class="menu-item-link">
                        <div class="menu-item" th:classappend="${activePage == 'dashboard'} ? 'active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            <span>Tổng quan</span>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="tools.html" th:href="@{/tools}" class="menu-item-link">
                        <div class="menu-item" th:classappend="${activePage == 'tools'} ? 'active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            <span>Công cụ Affiliate</span>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="income.html" th:href="@{/income}" class="menu-item-link">
                        <div class="menu-item" th:classappend="${activePage == 'income'} ? 'active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                            <span>Quản lý thu nhập</span>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="referral.html" th:href="@{/referral}" class="menu-item-link">
                        <div class="menu-item" th:classappend="${activePage == 'referral'} ? 'active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                            <span>Mời bạn bè</span>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="profile.html" th:href="@{/profile}" class="menu-item-link">
                        <div class="menu-item" th:classappend="${activePage == 'profile'} ? 'active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <span>Hồ sơ cá nhân</span>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="report.html" th:href="@{/report}" class="menu-item-link">
                        <div class="menu-item" th:classappend="${activePage == 'report'} ? 'active'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            <span>Hỗ trợ</span>
                        </div>
                    </a>
                </li>
            </ul>
        </nav>
        
        <!-- Thẻ hạng KOC Hạng Vàng phía góc dưới -->
        <a href="rank.html" th:href="@{/rank}" class="menu-item-link" style="margin-top: auto; display: block; text-decoration: none;">
            <div class="gold-card" th:classappend="${activePage == 'rank'} ? 'active'">
                <div class="gold-crown-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M2 4l3 7.5L12 2l7 9.5L22 4v16H2V4zm2 4.5V18h16V8.5l-3.5 4.8L12 5.5l-4.5 7.8L4 8.5z"/>
                    </svg>
                </div>
                <div class="gold-meta">
                    <span class="gold-title" th:text="${profile?.rank}">KOC Hạng Vàng</span>
                    <p class="gold-subtitle">Bạn đang ở hạng cao nhất</p>
                </div>
                <div class="gold-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
            </div>
        </a>
    </aside>

</body>
</html>
