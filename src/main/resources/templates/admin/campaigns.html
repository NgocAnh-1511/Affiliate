<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khởi tạo Chiến dịch Mới - Admin Portal</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Khởi tạo chiến dịch tiếp thị liên kết mới cho đối tác KOC/KOL.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- CSS (overview.css chứa sidebar, campaigns.css chứa giao diện trang) -->
    <link rel="stylesheet" href="../../static/css/admin/overview.css" th:href="@{/css/admin/overview.css}">
    <link rel="stylesheet" href="../../static/css/admin/campaigns.css" th:href="@{/css/admin/campaigns.css}">
</head>
<body>

    <div class="overview-container">
        
        <!-- Thanh Điều hướng Bên trái Admin dùng chung -->
        <aside th:replace="~{admin/nav :: sidebar('campaigns')}"></aside>
        
        <!-- Khung nội dung chính -->
        <main class="main-content">
            
            <!-- Thanh tác vụ trên cùng (Header bar) -->
            <header class="header-bar">
                <!-- Breadcrumbs & Tiêu đề -->
                <div class="header-title-wrapper">
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <span class="breadcrumb-item">Quản lý Chiến dịch</span>
                        <span class="breadcrumb-separator">›</span>
                        <span class="breadcrumb-item active">Khởi tạo Chiến dịch Mới</span>
                    </nav>
                    <h1 class="welcome-heading">Khởi tạo Chiến dịch Mới</h1>
                </div>
                
                <div class="header-actions">
                    <!-- Dropdown trạng thái chiến dịch -->
                    <div class="status-dropdown-container">
                        <select class="campaign-status-select" id="campaignStatusSelect">
                            <option value="active">🟢 Kích hoạt</option>
                            <option value="draft">🟡 Lưu nháp</option>
                        </select>
                    </div>

                    <!-- Nút thông báo hệ thống (badge 5 chuẩn ảnh thiết kế) -->
                    <button type="button" class="icon-button" id="bellNotificationBtn" aria-label="Thông báo hệ thống">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="notification-badge-count">5</span>
                    </button>
                    
                    <!-- Dropdown Admin -->
                    <div class="user-dropdown-container">
                        <div class="user-profile-menu" id="userProfileMenu" aria-haspopup="true" aria-expanded="false">
                            <img src="../../static/images/profile_avatar.png" th:src="@{/images/profile_avatar.png}" class="user-small-avatar" alt="Admin Avatar">
                            <span class="user-menu-name">Admin System</span>
                            <svg class="chevron-down" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        
                        <!-- Dropdown menu Đăng xuất -->
                        <div class="dropdown-menu" id="userDropdownMenu" role="menu">
                            <a href="../login.html" th:href="@{/logout}" class="dropdown-item" role="menuitem">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/>
                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                                <span>Đăng xuất</span>
                            </a>
                        </div>
                    </div>
                </div>
            </header>
            
            <form id="campaignForm">
                
                <!-- THẺ THÔNG TIN CƠ BẢN (Card 1) -->
                <section class="card form-card">
                    <h3 class="card-section-title">Thông tin cơ bản</h3>
                    
                    <div class="form-grid-3">
                        <!-- Tên chiến dịch -->
                        <div class="form-group">
                            <label for="campaignName" class="form-label">Tên chiến dịch <span class="required">*</span></label>
                            <input type="text" id="campaignName" class="form-control-input" th:value="${campaign?.name}" placeholder="Nhập tên chiến dịch..." required>
                        </div>
                        
                        <!-- Thời gian diễn ra -->
                        <div class="form-group">
                            <label for="campaignDuration" class="form-label">Thời gian diễn ra <span class="required">*</span></label>
                            <div class="input-icon-wrapper">
                                <svg class="input-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                <input type="text" id="campaignDuration" class="form-control-input has-icon" th:value="${campaign?.duration}" placeholder="Ví dụ: 01/10/2026 - 31/12/2026" required>
                            </div>
                        </div>
                        
                        <!-- Tổng ngân sách -->
                        <div class="form-group">
                            <label for="campaignBudget" class="form-label">Tổng Ngân sách (VNĐ) <span class="required">*</span></label>
                            <div class="input-suffix-wrapper">
                                <input type="text" id="campaignBudget" class="form-control-input has-suffix" th:value="${campaign?.budget}" placeholder="Nhập ngân sách..." required>
                                <span class="input-suffix-text">VNĐ</span>
                            </div>
                        </div>
                    </div>
                </section>
                
                <!-- THÈ CẤU HÌNH HOA HỒNG PHÂN TẦNG (Card 2) -->
                <section class="card form-card">
                    <h3 class="card-section-title">Cấu hình Hoa hồng theo Hạng (Tiered Commission)</h3>
                    
                    <div class="commission-tiers-wrapper">
                        <!-- Tiêu đề các cột -->
                        <div class="tiers-header-row">
                            <div class="col-hdr-tier">Hạng KOC</div>
                            <div class="col-hdr-rate">Tỷ lệ hoa hồng (%)</div>
                            <div class="col-hdr-status">Trạng thái</div>
                            <div class="col-hdr-action"></div>
                        </div>
                        
                        <!-- Danh sách các dòng hạng (Commission Tiers Rows) -->
                        <div class="tiers-list-container" id="tiersListContainer">
                            <!-- Lặp dữ liệu từ Backend -->
                            <div th:each="tier : ${campaign?.commissionTiers}" class="tier-row" th:data-id="${tier.id}">
                                <!-- Cột 1: Thông tin hạng -->
                                <div class="col-tier-info">
                                    <!-- Hiển thị Icon phù hợp -->
                                    <div class="tier-icon-circle" th:classappend="${tier.icon}">
                                        <span th:if="${tier.icon == 'diamond'}">💎</span>
                                        <span th:if="${tier.icon == 'gold'}">🏆</span>
                                        <span th:if="${tier.icon == 'silver'}">🥈</span>
                                        <span th:if="${tier.icon == 'basic'}">😊</span>
                                    </div>
                                    <div class="tier-meta">
                                        <span class="tier-name-text" th:text="${tier.rankName}">Hạng Kim Cương</span>
                                        <span class="tier-requirement-text" th:text="${tier.requirement}">Doanh thu ≥ 100,000,000 VNĐ</span>
                                    </div>
                                </div>
                                
                                <!-- Cột 2: Tỷ lệ hoa hồng % -->
                                <div class="col-tier-rate">
                                    <div class="rate-input-wrapper">
                                        <input type="number" class="rate-input-control" th:value="${tier.rate}" min="0" max="100">
                                        <span class="rate-suffix">%</span>
                                    </div>
                                </div>
                                
                                <!-- Cột 3: Trạng thái công tắc bật/tắt -->
                                <div class="col-tier-status">
                                    <label class="toggle-switch">
                                        <input type="checkbox" class="toggle-checkbox" th:checked="${tier.active}">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                
                                <!-- Cột 4: Tay nắm kéo thả (drag handle) -->
                                <div class="col-tier-action">
                                    <div class="drag-handle-btn" title="Kéo thả sắp xếp">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="drag-icon"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Nút bấm viền nét đứt thêm hạng hoa hồng KOC động -->
                        <button type="button" class="btn-add-tier-dashed" id="addTierBtn">
                            <span class="plus-icon">+</span> Thêm hạng KOC
                        </button>
                    </div>
                </section>
                
                <!-- THANH HÀNH ĐỘNG DƯỚI CÙNG (Footer Actions) -->
                <div class="campaign-form-actions">
                    <button type="button" class="btn-cancel-campaign" id="btnCancelCampaign">Hủy bỏ</button>
                    
                    <div class="right-actions-group">
                        <button type="button" class="btn-draft-campaign" id="btnDraftCampaign">Lưu Nháp</button>
                        <button type="submit" class="btn-submit-campaign" id="btnPublishCampaign">
                            <!-- SVG máy bay giấy giống thiết kế -->
                            <svg class="send-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            <span>Xuất Bản Chiến dịch</span>
                        </button>
                    </div>
                </div>
                
            </form>
            
        </main>
    </div>

    <!-- TOAST THÔNG BÁO CHO ADMIN -->
    <div class="toast-notification" id="adminToast">
        <span class="toast-icon">✓</span>
        <span class="toast-message">Xuất bản chiến dịch thành công!</span>
    </div>

    <!-- Script điều hướng logic trang -->
    <script src="../../static/js/admin/campaigns.js" th:src="@{/js/admin/campaigns.js}"></script>
</body>
</html>
