<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Từ chối Truy cập (Access Denied)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3f2fd4;
            --primary-hover: #2e1fc1;
            --bg-dark: #080c24;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: #0b0f19; /* Nền tối sâu cực kỳ cao cấp */
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .error-wrapper {
            text-align: center;
            max-width: 480px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: errorFadeIn 0.5s ease-out forwards;
        }

        @keyframes errorFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-shield {
            color: #ef4444;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.3));
            animation: shieldPulse 2s infinite ease-in-out;
        }

        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }

        .error-message {
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.85rem;
        }

        .btn-safety {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 0.75rem 1.65rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(63, 47, 212, 0.35);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
        }

        .btn-safety:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(63, 47, 212, 0.5);
        }

        .btn-safety svg {
            stroke-width: 2.5px;
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <!-- SVG Shield Lock Alert -->
        <svg class="icon-shield" xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <rect x="9" y="11" width="6" height="5" rx="1"/>
            <path d="M12 11V9a2 2 0 0 1 4 0v2"/>
        </svg>
        
        <h1 class="error-code">403</h1>
        <h2 class="error-title">Từ chối Truy cập (Access Denied)</h2>
        <p class="error-message">
            Tài khoản của bạn (KOL/KOC) không có đặc quyền để truy cập phân hệ quản trị tối cao của Admin. Vui lòng quay về trang Tổng quan đối tác để tiếp tục làm việc.
        </p>
        
        <a href="/dashboard" th:href="@{/dashboard}" class="btn-safety">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Quay về Dashboard KOC</span>
        </a>
    </div>

</body>
</html>
