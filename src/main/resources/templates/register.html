<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên KOC/KOL - Affiliate Network</title>
    
    <!-- Meta SEO tiêu chuẩn -->
    <meta name="description" content="Đăng ký tài khoản KOC/KOL Affiliate Network để gia nhập mạng lưới tiếp thị liên kết, nhận chiến dịch quảng cáo và gia tăng doanh số.">
    <meta name="robots" content="index, follow">
    
    <!-- Liên kết Tệp CSS thiết kế cao cấp (Có fallback href để mở trực tiếp trên trình duyệt) -->
    <link rel="stylesheet" href="../static/css/login.css" th:href="@{/css/login.css}">
</head>
<body>

    <div class="container register-container">
        
        <!-- Cột Trái: Banner Quảng cáo Tiếp thị liên kết (Tải từ ảnh register_banner.png) -->
        <div class="banner-column register-banner" id="bannerColumn"></div>
        
        <!-- Cột Phải: Form Đăng ký tài khoản (Tuyệt đối không scroll, căn đều sang trọng) -->
        <div class="form-column">
            <div class="form-wrapper">
                
                <!-- Logo Thương hiệu KOC/KOL Affiliate Network -->
                <div class="logo-container" id="brandLogo">
                    <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#7c3aed" />
                                <stop offset="60%" stop-color="#4f46e5" />
                                <stop offset="100%" stop-color="#2563eb" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="20" r="10" fill="url(#logoGrad)" />
                        <path d="M50 35C41 35 30 40 22 46C29 48 37 47 43 47V78C43 83 57 83 57 78V47C63 47 71 48 78 46C70 40 59 35 50 35Z" fill="url(#logoGrad)" />
                        <path d="M28 42L18 78C16 83 24 85 26 80L36 45C32 44 30 43 28 42Z" fill="url(#logoGrad)" opacity="0.8" />
                        <path d="M72 42L82 78C84 83 76 85 74 80L64 45C68 44 70 43 72 42Z" fill="url(#logoGrad)" opacity="0.8" />
                    </svg>
                    <div class="logo-text-group">
                        <span class="logo-text-top">KOC/KOL</span>
                        <span class="logo-text-bottom">Affiliate Network</span>
                    </div>
                </div>
                
                <!-- Tiêu đề & Lời chào đăng ký (Chính xác theo thiết kế gốc) -->
                <div class="welcome-header" style="text-align: center; margin-top: 1.5rem;">
                    <h1 class="welcome-title" style="font-size: 2.1rem; font-weight: 800; color: #111827; margin-bottom: 0.5rem; letter-spacing: -0.75px;">Đăng ký đối tác KOC/KOL</h1>
                    <p class="welcome-subtitle" style="font-size: 0.95rem; color: #4b5563;">Vui lòng điền thông tin để tạo tài khoản và lấy link Affiliate.</p>
                </div>
                
                <!-- Biểu mẫu đăng ký liên kết với Spring MVC Model -->
                <form id="registerForm" class="login-form" th:action="@{/register}" th:object="${registerRequest}" method="POST">
                    
                    <!-- Hiển thị thông báo LỖI từ Spring Boot Controller -->
                    <div th:if="${errorMessage}" class="alert alert-danger" th:classappend="${errorMessage != null} ? 'alert-show' : ''" role="alert" style="transition: opacity 0.4s ease, transform 0.4s ease, margin 0.4s ease, padding 0.4s ease, height 0.4s ease;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span th:text="${errorMessage}">Thông báo lỗi đăng ký</span>
                        <button type="button" class="alert-close-btn" style="background: none; border: none; color: inherit; font-size: 1.3rem; cursor: pointer; margin-left: auto; line-height: 1; padding: 0 4px; display: flex; align-items: center; justify-content: center;" onclick="this.parentElement.style.opacity='0'; this.parentElement.style.transform='translateY(-8px)'; setTimeout(() => { this.parentElement.style.height='0'; this.parentElement.style.padding='0'; this.parentElement.style.margin='0'; this.parentElement.style.border='none'; setTimeout(() => this.parentElement.remove(), 400); }, 400);" aria-label="Đóng">&times;</button>
                    </div>

                    <!-- Hiển thị thông báo THÀNH CÔNG từ Spring Boot Controller -->
                    <div th:if="${successMessage}" class="alert alert-success" th:classappend="${successMessage != null} ? 'alert-show' : ''" role="alert" style="transition: opacity 0.4s ease, transform 0.4s ease, margin 0.4s ease, padding 0.4s ease, height 0.4s ease;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22,4 12,14.01 9,11.01"/>
                        </svg>
                        <span th:text="${successMessage}">Thông báo đăng ký thành công</span>
                        <button type="button" class="alert-close-btn" style="background: none; border: none; color: inherit; font-size: 1.3rem; cursor: pointer; margin-left: auto; line-height: 1; padding: 0 4px; display: flex; align-items: center; justify-content: center;" onclick="this.parentElement.style.opacity='0'; this.parentElement.style.transform='translateY(-8px)'; setTimeout(() => { this.parentElement.style.height='0'; this.parentElement.style.padding='0'; this.parentElement.style.margin='0'; this.parentElement.style.border='none'; setTimeout(() => this.parentElement.remove(), 400); }, 400);" aria-label="Đóng">&times;</button>
                    </div>
                    
                    <!-- Dòng 1: Họ và tên & Số điện thoại (Cột đôi tinh gọn) -->
                    <div class="form-row">
                        <!-- Ô nhập liệu: Họ và tên -->
                        <div class="input-group">
                            <div class="input-icon-left">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <input type="text" 
                                   id="fullName" 
                                   th:field="*{fullName}" 
                                   class="form-input" 
                                   placeholder="Họ và tên" 
                                   required>
                        </div>

                        <!-- Ô nhập liệu: Số điện thoại -->
                        <div class="input-group">
                            <div class="input-icon-left">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                </svg>
                            </div>
                            <input type="tel" 
                                   id="phone" 
                                   th:field="*{phone}" 
                                   class="form-input" 
                                   placeholder="Số điện thoại" 
                                   required>
                        </div>
                    </div>

                    <!-- Dòng 2: Địa chỉ Email (Rộng 100%) -->
                    <div class="input-group">
                        <div class="input-icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </div>
                        <input type="email" 
                               id="email" 
                               th:field="*{email}" 
                               class="form-input" 
                               placeholder="Địa chỉ Email" 
                               required>
                    </div>

                    <!-- Dòng 3: Link kênh mạng xã hội chính (Rộng 100%) -->
                    <div class="input-group">
                        <div class="input-icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                            </svg>
                        </div>
                        <input type="url" 
                               id="socialChannelLink" 
                               th:field="*{socialChannelLink}" 
                               class="form-input" 
                               placeholder="Link kênh mạng xã hội chính (TikTok/Shopee)" 
                               required>
                    </div>

                    <!-- Dòng: Mã giới thiệu (Không bắt buộc) -->
                    <div class="input-group">
                        <div class="input-icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </div>
                        <input type="text" 
                               id="referralCode" 
                               th:field="*{referralCode}" 
                               class="form-input" 
                               placeholder="Mã giới thiệu (Không bắt buộc)">
                    </div>
                    
                    <!-- Dòng 4: Mật khẩu (Rộng 100%) -->
                    <div class="input-group">
                        <div class="input-icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                        <input type="password" 
                               id="password" 
                               th:field="*{password}" 
                               class="form-input form-input-password" 
                               placeholder="Mật khẩu" 
                               required>
                        <button type="button" class="input-icon-right" id="togglePassword" aria-label="Hiển thị mật khẩu">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" y1="2" x2="22" y2="22"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Dòng 5: Xác nhận Mật khẩu (Rộng 100%) -->
                    <div class="input-group">
                        <div class="input-icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                        <input type="password" 
                               id="confirmPassword" 
                               th:field="*{confirmPassword}" 
                               class="form-input form-input-password" 
                               placeholder="Xác nhận Mật khẩu" 
                               required>
                        <button type="button" class="input-icon-right" id="toggleConfirmPassword" aria-label="Hiển thị mật khẩu">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" y1="2" x2="22" y2="22"/>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Lựa chọn Đồng ý Điều khoản & Chính sách -->
                    <div class="options-group" style="margin-bottom: 1rem;">
                        <label class="remember-me" for="agreeToTerms" style="justify-content: flex-start; width: 100%;">
                            <input type="checkbox" id="agreeToTerms" th:field="*{agreeToTerms}" required>
                            <span>Tôi đồng ý với <a href="#" class="forgot-password-link" style="font-size: 0.85rem; font-weight: 600;">Điều khoản dịch vụ</a> và <a href="#" class="forgot-password-link" style="font-size: 0.85rem; font-weight: 600;">Chính sách bảo mật</a></span>
                        </label>
                    </div>
                    
                    <!-- Nút Gửi biểu mẫu (ĐĂNG KÝ TÀI KHOẢN) -->
                    <button type="submit" class="btn-submit" id="btnSubmit">ĐĂNG KÝ TÀI KHOẢN</button>
                </form>
                
                <!-- Dải phân cách "Hoặc đăng ký với" -->
                <div class="divider" role="separator">
                    <span>Hoặc đăng ký với</span>
                </div>
                
                <!-- Các nút Đăng ký nhanh qua Mạng xã hội -->
                <div class="social-group">
                    <button type="button" class="btn-social" id="btnTikTokRegister">
                        <div class="social-logo">
                            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.17-2.86-.74-3.94-1.74-.22-.2-.43-.4-.64-.62v7.14c.01 1.87-.5 3.79-1.75 5.17-1.42 1.58-3.67 2.45-5.79 2.14-2.45-.35-4.63-2.14-5.26-4.57-.75-2.9.75-6.09 3.52-7.14 1.13-.43 2.37-.53 3.55-.28V14c-1.39-.42-2.99-.08-4.04.91-1.17 1.1-1.49 2.94-.8 4.39.63 1.33 2.1 2.22 3.58 2.15 1.55.03 2.99-.95 3.42-2.43.14-.49.19-.99.18-1.5V.02h.02z"/>
                            </svg>
                        </div>
                        <span>TikTok</span>
                    </button>
                    
                    <button type="button" class="btn-social" id="btnGoogleRegister">
                        <div class="social-logo">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                            </svg>
                        </div>
                        <span>Google</span>
                    </button>
                    
                    <button type="button" class="btn-social" id="btnFacebookRegister">
                        <div class="social-logo">
                            <svg viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                        </div>
                        <span>Facebook</span>
                    </button>
                </div>
                
                <!-- Chân trang liên kết đăng nhập (Chính xác theo thiết kế gốc) -->
                <div class="signup-footer">
                    <span>Đã có tài khoản? </span>
                    <a href="login.html" th:href="@{/login}" class="signup-link" style="color: #3f2fd4; font-weight: 600;">Đăng nhập ngay</a>
                </div>
                
            </div>
        </div>
        
    </div>

    <!-- Liên kết Tệp Javascript xử lý logic động (Có fallback src để mở trực tiếp trên trình duyệt) -->
    <script src="../static/js/register.js" th:src="@{/js/register.js}"></script>
</body>
</html>
